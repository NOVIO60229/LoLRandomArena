name: DDragon auto-update

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ddragon-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:                             # ← 將 step 輸出轉成 job 輸出
      changed: ${{ steps.commitIfAny.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run updater
        run: |
          node scripts/check_and_update.js

      - id: commitIfAny            
        name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "OLDMAN"
            git config user.email "h0048625@gmail.com"
            ver=$(cat data/latest.txt 2>/dev/null || echo "update")
            git add -A
            git commit -m "Update DDragon to ${ver}"
            git push
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changed=true"  >> "$GITHUB_OUTPUT"
          fi
  deploy_if_changed:
    needs: update
    if: ${{ needs.update.outputs.changed == 'true' }}   
    uses: ./.github/workflows/static.yml               # ← 直接呼叫 static.yml

